name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Lint & format
        run: bunx biome ci .
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
